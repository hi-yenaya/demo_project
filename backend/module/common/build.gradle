// module:common - 라이브러리 모듈 (독립 실행 불가)
// Spring Boot 플러그인을 적용하지 않고 일반 JAR로 빌드
plugins {
    id 'java-library'
}

dependencies {
    // 범용 유틸리티 의존성만 허용
    // Spring Web / JPA 등 특정 계층 의존성을 포함하지 말 것
    implementation 'org.springframework:spring-context'
}

// 실행 가능한 bootJar가 아닌 일반 JAR로 빌드
jar {
    enabled = true
}
