spring:
  application:
    name: demo-web
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 민감정보는 환경 변수로 주입 (미설정 시 기본값 사용)
    url: ${DB_URL:jdbc:mysql://localhost:3306/ori_med?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: ${DB_DDL_AUTO:none}
    properties:
      hibernate:
        format_sql: true
    show-sql: true
    open-in-view: false

server:
  port: 8080

# Spring Boot 기본 디버그 모드 (필요시 활성화: 주석 해제)
# debug: true

logging:
  level:
    root: INFO
    com.example: DEBUG
    org.springframework.web: DEBUG
    org.springframework.boot.autoconfigure: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
